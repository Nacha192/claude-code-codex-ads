<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ad engine</title>
<!--
  The engine. Copy this into the project as engine.html and edit it.

  One HTML file holds every layout. A layout is selected by URL:
      engine.html?ad=3&ratio=9x16

  Render with:  node render_ads.mjs
  Check with:   python redline_check.py

  Three things this file is doing on purpose, each learned from a real failure:

  1. The canvas is sized from the RATIO, in CSS variables, and every layout
     positions itself against those variables. Nothing is hard-coded to one
     width. A layout written against a fixed 432px silently comes out cropped
     at 1.91:1, with no error anywhere.

  2. Text lives in the AD_LAYOUTS array, as strings. That is what makes the
     batch greppable, diffable, countable, and checkable by redline_check.py.
     Text baked into markup is text nobody can audit.

  3. Safe margins are enforced by a class, not by eye. On 9:16 the top and
     bottom reserves are where the platform paints its own interface over
     yours.
-->
<style>
  :root {
    /* ---- brand: edit these five lines and most of the work is done ---- */
    --ink:      #14161a;
    --paper:    #f4f1ea;
    --accent:   #b5892f;
    --font:     "Helvetica Neue", Arial, sans-serif;
    --font-display: var(--font);

    /* ---- canvas: set by JS from the ratio, do not hard-code sizes ---- */
    --w: 432px;
    --h: 540px;
    --safe: 12%;          /* ratios.safe_margin */
    --safe-top: 0%;       /* 9:16 only */
    --safe-bottom: 0%;    /* 9:16 only */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #888; }
  body { width: var(--w); height: var(--h); overflow: hidden; }

  #canvas {
    position: relative;
    width: var(--w);
    height: var(--h);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
  }

  /* Nothing readable goes outside this box. */
  .safe {
    position: absolute;
    left: var(--safe); right: var(--safe);
    top: calc(var(--safe) + var(--safe-top));
    bottom: calc(var(--safe) + var(--safe-bottom));
    display: flex; flex-direction: column;
  }

  .bleed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .veil  { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 45%, rgba(0,0,0,.65) 100%); }

  .hook {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 8.2cqw;
    line-height: 1.02;
    letter-spacing: -.02em;
  }
  .sub  { font-size: 3.6cqw; line-height: 1.35; margin-top: 3.5%; opacity: .92; }
  .cta  {
    align-self: flex-start; margin-top: auto;
    background: var(--accent); color: #fff;
    padding: 2.4% 5%; border-radius: 999px;
    font-weight: 700; font-size: 3.4cqw;
  }
  .on-dark { color: #fff; }
  #canvas { container-type: size; }
</style>
</head>
<body>
<div id="canvas"></div>

<script>
/* ------------------------------------------------------------------ *
 * 1. The ratios. render_ads.mjs knows the pixel sizes; the engine only
 *    needs the shape and the reserves.
 * ------------------------------------------------------------------ */
var RATIOS = {
  '4x5':    { w: 432, h: 540, top: '0%',  bottom: '0%'  },
  '9x16':   { w: 432, h: 768, top: '2%',  bottom: '8%'  },  /* platform UI */
  '1x1':    { w: 432, h: 432, top: '0%',  bottom: '0%'  },
  '1.91x1': { w: 480, h: 251, top: '0%',  bottom: '0%'  }
};

/* ------------------------------------------------------------------ *
 * 2. Assets. One constant per image, so a swap is one line.
 * ------------------------------------------------------------------ */
var IMG = {
  scene:   'img/scene.jpg',
  product: 'img/product-cutout.png'
};

/* ------------------------------------------------------------------ *
 * 3. The layouts. Text lives HERE, as strings.
 *    id     stable, used in the URL
 *    slug   the file name. Name the angle, never a bare number.
 *    render returns the HTML for the canvas.
 * ------------------------------------------------------------------ */
var AD_LAYOUTS = [
  {
    id: 1,
    slug: 'ad-01-the-clock',
    note: 'Layout 12, the clock. Situation only. Strongest cold opener.',
    render: function () {
      return '' +
        '<img class="bleed" src="' + IMG.scene + '" alt="">' +
        '<div class="veil"></div>' +
        '<div class="safe on-dark">' +
          '<div class="hook">3 a.m.<br>Third time.</div>' +
          '<div class="sub">It is still where you put it.</div>' +
          '<div class="cta">See how</div>' +
        '</div>';
    }
  },
  {
    id: 2,
    slug: 'ad-02-without-with',
    note: 'Layout 2. Two real photographs. The "without" must be honest.',
    render: function () {
      return '' +
        '<div style="position:absolute;inset:0;display:flex">' +
          '<div style="flex:1;position:relative;overflow:hidden">' +
            '<img class="bleed" src="' + IMG.scene + '" alt="">' +
            '<div style="position:absolute;left:8%;top:6%;font-weight:800;font-size:3.4cqw;color:#fff">WITHOUT</div>' +
          '</div>' +
          '<div style="flex:1;position:relative;overflow:hidden;background:var(--paper)">' +
            '<img class="bleed" src="' + IMG.product + '" alt="" style="object-fit:contain;padding:8%">' +
            '<div style="position:absolute;left:8%;top:6%;font-weight:800;font-size:3.4cqw">WITH</div>' +
          '</div>' +
        '</div>' +
        '<div class="safe" style="justify-content:flex-end">' +
          '<div class="hook" style="font-size:6.4cqw">One of them is still<br>there at 7 a.m.</div>' +
          '<div class="cta">See how</div>' +
        '</div>';
    }
  },
  {
    id: 3,
    slug: 'ad-03-reverse',
    note: 'Layout 9, reverse psychology. The disqualifier has to be true.',
    render: function () {
      return '' +
        '<div class="safe">' +
          '<div class="hook">Do not buy this.</div>' +
          '<div class="sub">Not if what you have already stays put all night. ' +
            'This one is held by a strap. That is the whole difference.</div>' +
          '<img src="' + IMG.product + '" alt="" style="width:52%;align-self:center;margin:6% 0">' +
          '<div class="cta">Read the rest</div>' +
        '</div>';
    }
  }
];

/* Expose for render_ads.mjs. Do not rename: the renderer reads this. */
window.AD_LAYOUTS = AD_LAYOUTS.map(function (l) {
  return { id: l.id, slug: l.slug };
});

/* ------------------------------------------------------------------ *
 * 4. Boot. Reads ?ad= and ?ratio=, sizes the canvas, renders one layout.
 * ------------------------------------------------------------------ */
(function () {
  var q = new URLSearchParams(location.search);
  var wanted = parseInt(q.get('ad') || '1', 10);
  var ratio = q.get('ratio') || '4x5';
  var r = RATIOS[ratio] || RATIOS['4x5'];

  var root = document.documentElement.style;
  root.setProperty('--w', r.w + 'px');
  root.setProperty('--h', r.h + 'px');
  root.setProperty('--safe-top', r.top);
  root.setProperty('--safe-bottom', r.bottom);

  var layout = null;
  for (var i = 0; i < AD_LAYOUTS.length; i++) {
    if (AD_LAYOUTS[i].id === wanted) { layout = AD_LAYOUTS[i]; break; }
  }
  if (!layout) { layout = AD_LAYOUTS[0]; }

  document.getElementById('canvas').innerHTML = layout.render();
})();
</script>
</body>
</html>
