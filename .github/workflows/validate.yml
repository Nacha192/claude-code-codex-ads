# Continuous integration: rebuild the four packs, run the tests, and validate
# the release on every push, so a broken layout cannot reach the main branch.
name: Validate four skill packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s system/tests -v
      - run: python system/scripts/build.py
      - run: python system/scripts/validate_release.py
