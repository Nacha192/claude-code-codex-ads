# Continuous integration: rebuild the eight packs, run the tests, and validate
# the release on every push, so a broken layout cannot reach the main branch.
name: Validate eight skill packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      # Both runners always report. With fail-fast the first failure cancelled the
      # other, so half the information about a cross-platform defect was thrown away
      # exactly when it was needed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The history scan needs the history. checkout fetches one commit by
          # default, which would make that check pass by having nothing to read.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # First on the committed tree: the published archives and checksums must
      # already describe the packs a visitor downloads, before anything rebuilds.
      - name: Validate the committed release
        run: python system/scripts/validate_release.py
      # validate_release reads the checked-out tree. A clone carries every commit,
      # so a file published once and removed later is still published.
      - name: Scan every commit, not only the tree
        run: python system/scripts/scan_history.py
      # Without ffmpeg every test that decodes or renders a file skips, which is the
      # half of quality control this repository is actually about. Both runners get
      # it, because the engine's job is to produce the same three files on a machine
      # that is not the author's, and a check that only ever runs on Linux does not
      # test that.
      - name: Install ffmpeg on Linux so the render tests really run
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg on macOS so the render tests really run there too
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m unittest discover -s system/tests -v
      - run: python system/scripts/build.py
      # The committed packs must be exactly what the committed sources produce.
      # ZIP bytes are left out: DEFLATE output can differ between zlib versions,
      # and validate_release already compares archive contents file by file.
      - name: Refuse drift between sources and committed packs
        run: git diff --exit-code -- you-can-install-skill system
      - run: python system/scripts/validate_release.py
