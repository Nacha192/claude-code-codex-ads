# Continuous integration: rebuild the eight packs, run the tests, and validate
# the release on every push, so a broken layout cannot reach the main branch.
name: Validate eight skill packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # First on the committed tree: the published archives and checksums must
      # already describe the packs a visitor downloads, before anything rebuilds.
      - name: Validate the committed release
        run: python system/scripts/validate_release.py
      - run: python -m unittest discover -s system/tests -v
      - run: python system/scripts/build.py
      # The committed packs must be exactly what the committed sources produce.
      # ZIP bytes are left out: DEFLATE output can differ between zlib versions,
      # and validate_release already compares archive contents file by file.
      - name: Refuse drift between sources and committed packs
        run: git diff --exit-code -- you-can-install-skill system
      - run: python system/scripts/validate_release.py
